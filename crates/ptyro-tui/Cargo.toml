[package]
name = "ptyro-tui"
description = "The ptyro terminal UI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
crossterm.workspace = true
futures.workspace = true
nucleo-matcher.workspace = true
serde.workspace = true
serde_json.workspace = true
ptyro-agents.workspace = true
ptyro-client.workspace = true
ptyro-core.workspace = true
ptyro-protocol.workspace = true
ptyro-run.workspace = true
ratatui.workspace = true
rustix.workspace = true
tokio.workspace = true
unicode-width.workspace = true

# ptyro-pty, the one crate allowed `unsafe`: local time, and making a file private (an access
# list on Windows, WIN7). On Windows the clock uses the time crate's local offset (WIN3).
ptyro-pty.workspace = true

[target.'cfg(windows)'.dependencies]
time = { workspace = true, features = ["local-offset"] }

[dev-dependencies]
criterion.workspace = true
ptyro-term.workspace = true
tempfile.workspace = true

[[bench]]
name = "paint"
harness = false
