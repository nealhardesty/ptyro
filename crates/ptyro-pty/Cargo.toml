[package]
name = "ptyro-pty"
description = "PTY spawn/resize/signal, process groups, cwd and foreground-process probes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ptyro-core.workspace = true
tokio.workspace = true

[target.'cfg(unix)'.dependencies]
pty-process.workspace = true
rustix.workspace = true
libc.workspace = true

# Local time on Windows (`probe.rs`): the time crate's local offset, sound there. ConPTY, Job
# Objects and named pipes: windows-sys (WIN5).
[target.'cfg(windows)'.dependencies]
time = { workspace = true, features = ["local-offset"] }
windows-sys.workspace = true

[dev-dependencies]
tempfile.workspace = true
