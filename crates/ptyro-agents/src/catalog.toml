[[item]]
id = "gh"
name = "GitHub CLI"
kind = "tool"
program = "gh"
doc = "https://github.com/cli/cli#installation"
checked = "2026-11-06"
version = ["gh", "--version"]              # `gh version 2.57.0 (2024-09-16)`
note = "Updated by its own package manager; ptyro doesn't check it for new versions."
login = { start = ["gh", "auth", "login", "--web"], check = ["gh", "auth", "status"], mark = "V", note = "`gh auth status` exits 1 when logged out (checked with 2.57.0)" }
latest = { source = "github-release", url = "https://api.github.com/repos/cli/cli/releases/latest", tag_prefix = "v", mark = "V" }

[[item.methods]]
platforms = ["linux", "wsl"]
via = "apt"
shell = "sh"
needs = "apt-get"
install = '''
(type -p wget >/dev/null || (sudo apt update && sudo apt install wget -y)) \
&& sudo mkdir -p -m 755 /etc/apt/keyrings \
&& out=$(mktemp) && wget -nv -O$out https://cli.github.com/packages/githubcli-archive-keyring.gpg \
&& cat $out | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null \
&& sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg \
&& sudo mkdir -p -m 755 /etc/apt/sources.list.d \
&& echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null \
&& sudo apt update \
&& sudo apt install gh -y'''
update = "sudo apt update && sudo apt install gh"
admin = true
mark = "V"
note = "GitHub's own apt repository; the docs warn that Debian's and Ubuntu's community packages (2.45.x, 2.46.x) are broken"

[[item.methods]]
platforms = ["linux", "wsl"]
via = "dnf"
shell = "sh"
needs = "dnf"
install = "sudo dnf install -y dnf5-plugins && sudo dnf config-manager addrepo --from-repofile=https://cli.github.com/packages/rpm/gh-cli.repo && sudo dnf install -y gh"
update = "sudo dnf update gh"
admin = true
mark = "V"
note = "the DNF5 form; on DNF4 the docs use `dnf install 'dnf-command(config-manager)'` and `config-manager --add-repo`"

[[item.methods]]
platforms = ["macos"]
via = "brew"
shell = "sh"
needs = "brew"
install = "brew install gh"
update = "brew upgrade gh"
mark = "V"

[[item.methods]]
platforms = ["windows-x64", "windows-arm64"]
via = "winget"
shell = "powershell"
needs = "winget"
install = "winget install --id GitHub.cli --source winget"
update = "winget upgrade --id GitHub.cli --source winget"
admin = true
mark = "V"

