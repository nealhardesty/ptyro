# The version table (ROADMAP BOOT0, SPEC §24.1): how each agent and tool is installed, updated,
# versioned and logged in to, per platform. Every value here was read from the vendor's own
# documentation (or, where it says so, the vendor's installer script or the program itself) on
# the date in `checked`. Each method, latest-version source and login carries a mark:
#   V  verified against the vendor's current docs (or the program, run here)
#   S  second-hand: the vendor's own script or a third-party write-up, not the docs
#   U  unverified: nothing to read it from; `note` says what is missing
# A value nobody documents is left out (no `check`, no `update`), never guessed. RESEARCH
# segment G records the same facts, dated, with the sources.
#
# Platforms: linux, macos, wsl, windows-x64, windows-arm64.
# `shell`: "sh" runs the command with `sh -c` (it may pipe into `bash`); "powershell" with
#   `powershell -NoProfile -ExecutionPolicy Bypass -Command`.
# `via`: vendor (the vendor's own installer), npm, brew, winget, apt, dnf, xcode, node-dist
#   (the official nodejs.org build, unpacked into a folder ptyro owns: `url`, `sums`).
# `needs`: a program that must be on PATH for this method (apt-get, dnf, brew, winget, npm).
# `admin`: the method asks for administrator rights (sudo, or an installer's UAC prompt).
# `methods` are in order of preference: a platform's first method whose `needs` is present wins.
# `others` are the other ways an item may already be installed, with how each updates (BOOT5,
#   BOOT7's moves to the recommended method).

[[item]]
id = "claude"
name = "Claude Code"
kind = "agent"
program = "claude"
doc = "https://code.claude.com/docs/en/setup"
checked = "2026-11-06"
version = ["claude", "--version"]          # `2.1.319 (Claude Code)`
note = "Native installs update themselves in the background; `claude update` applies one now."
login = { start = ["claude", "auth", "login"], check = ["claude", "auth", "status"], mark = "V", note = "docs: run `claude` and follow the browser; `claude auth status` exits 1 when logged out (checked with 2.1.319)" }
latest = { source = "plain-text", url = "https://downloads.claude.ai/claude-code-releases/latest", mark = "S", note = "the URL the vendor's install.sh reads; the docs name the bucket, not this file" }
prereqs = [
  { item = "git", required = false, platforms = ["windows-x64", "windows-arm64"], why = "Git for Windows gives Claude its Bash tool; without it Claude uses PowerShell" },
]

[[item.methods]]
platforms = ["linux", "macos", "wsl"]
via = "vendor"
shell = "sh"
install = "curl -fsSL https://claude.ai/install.sh | bash"
update = "claude update"
auto_update = true
mark = "V"

[[item.methods]]
platforms = ["windows-x64", "windows-arm64"]
via = "vendor"
shell = "powershell"
install = "irm https://claude.ai/install.ps1 | iex"
update = "claude update"
auto_update = true
mark = "V"

[[item.others]]
platforms = ["linux", "macos", "wsl"]
via = "npm"
shell = "sh"
needs = "npm"
install = "npm install -g @anthropic-ai/claude-code"
update = "npm install -g @anthropic-ai/claude-code@latest"
mark = "V"
note = "the npm package needs Node.js 22 or later"

[[item.others]]
platforms = ["windows-x64", "windows-arm64"]
via = "npm"
shell = "powershell"
needs = "npm"
install = "npm install -g @anthropic-ai/claude-code"
update = "npm install -g @anthropic-ai/claude-code@latest"
mark = "V"
note = "the npm package needs Node.js 22 or later"

[[item.others]]
platforms = ["macos", "linux"]
via = "brew"
shell = "sh"
needs = "brew"
install = "brew install --cask claude-code"
update = "brew upgrade claude-code"
mark = "V"
note = "the `claude-code` cask is the stable channel; `claude-code@latest` updates with `brew upgrade claude-code@latest`"

[[item.others]]
platforms = ["windows-x64", "windows-arm64"]
via = "winget"
shell = "powershell"
needs = "winget"
install = "winget install Anthropic.ClaudeCode"
update = "winget upgrade Anthropic.ClaudeCode"
mark = "V"

