name: Bug report
description: Something in ptyro doesn't work as documented
body:
  - type: markdown
    attributes:
      value: |
        Security problem? Please don't file it here: see [SECURITY.md](../blob/master/SECURITY.md).
        Recordings and crash reports contain whatever was on screen, so check them for secrets before attaching.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Paste `ptyro --version` and `ptyro doctor`, plus your terminal (and tmux, if any).
      render: text
    validations: { required: true }
  - type: input
    id: agent
    attributes:
      label: Agent and version
      placeholder: e.g. Claude Code 2.1.305
