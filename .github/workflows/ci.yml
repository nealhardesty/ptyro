# ROADMAP M0.7, H2.2. CI calls the same make targets developers run (AGENTS.md: everything has one).
name: ci

on:
  push:            # every branch, so work-in-progress branches get checked before a PR exists
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The web app's logic tests need Node: a runner without it fails them instead of skipping.
  PTYRO_REQUIRE_NODE: "1"

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The platforms releases are built for: both Linux CPUs and Apple silicon. (macos-15-intel,
        # the x86_64 Mac image, is built at release time and checked by its tarball's smoke test.)
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    # A hung test fails the job instead of holding a runner for six hours.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22" }
      # rust-toolchain.toml pins the toolchain; `rustup show` installs it.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: make check

  # WSL2 is Tier 1 (SPEC §3.4): CI's main job inside a real WSL2 distro on a hosted Windows runner
  # (it has WSL2, systemd on: SPEC §20.10). The commit is cloned inside the distro, never checked
  # out on Windows: CRLF line endings and the slow /mnt/d would both get in the way. The distro's
  # disk is small: no incremental cache (rust-cache turns it off in the other jobs) and line
  # tables only, or the link after the tests runs it out (ld segfaults, ext4 goes read-only).
  wsl:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        with:
          distribution: Ubuntu-24.04
          additional-packages: build-essential pkg-config git make curl ca-certificates zsh
      - shell: wsl-bash {0}
        run: |
          set -e
          export CARGO_INCREMENTAL=0 CARGO_PROFILE_DEV_DEBUG=line-tables-only
          trap 'df -h / | tail -1; du -sh ~/ptyro/target 2>/dev/null' EXIT
          git init -q ~/ptyro && cd ~/ptyro
          git fetch -q --depth 1 https://github.com/${{ github.repository }} ${{ github.sha }}
          git checkout -q FETCH_HEAD
          make rust-install
          make test-wsl

  # Windows itself: the client crates' tests (WIN3), and a native daemon end to end in ConPTY with
  # the packaged ConPTY beside it (WIN5, `make test-windows`). Line endings stay as committed:
  # fixtures and scripts compare bytes.
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run: { shell: bash }
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: command -v make || choco install make -y --no-progress
      - run: make test-windows

  # The oldest compiler `rust-version` claims: what `cargo install` users may have.
  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: make msrv

  fuzz-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: make fuzz-smoke FUZZ_SECONDS=20
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-crashes
          path: target/fuzz-crashes/

  # The web app is committed compiled (web/dist) so `cargo install` needs no Node: it must match
  # its TypeScript sources.
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22" }
      - run: make web-check web-test

  # The web app in a real browser (Chrome is on the runner image); Node drives it over the
  # DevTools protocol, with no packages to install. Required here: a runner without Chrome fails.
  web-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PTYRO_REQUIRE_BROWSER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22" }
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: make web-e2e

  # Licenses, advisories, yanked crates and sources (deny.toml), through the same make target a
  # developer runs (`make tools` installs cargo-deny; the cache keeps it between runs).
  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: make tools deny

  # A release tarball is built here too, and the installer script has to install it: a change
  # that breaks packaging fails before a tag does.
  installer:
    name: installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: make installer-check
      - if: runner.os == 'macOS'
        run: make brew-check
        env: { PTYRO_REQUIRE_BREW: "1" }
