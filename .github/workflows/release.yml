# ROADMAP M8.8. Push a tag `vX.Y.Z` (matching Cargo.toml's version) to build every platform,
# publish a GitHub release with checksums and changelog notes, and update the Homebrew tap.
# Like CI, it calls make targets only.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true

# Read-only by default; only `publish` may write (it creates the release). The build jobs run
# every dependency's build scripts, so they never hold a write token.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ env.TAG }}", persist-credentials: false }
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: make check
      # The binary embeds web/dist: it must match web/src.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22" }
      - run: make web-check

  build:
    needs: check
    name: build (${{ matrix.triple }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, triple: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, triple: aarch64-unknown-linux-gnu }
          - { os: macos-14, triple: aarch64-apple-darwin }
          # macos-13 is retired; macos-15-intel is the supported x86_64 image.
          - { os: macos-15-intel, triple: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ env.TAG }}", fetch-depth: 0, persist-credentials: false }
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { key: "${{ matrix.triple }}" }
      - run: make changelog dist TRIPLE=${{ matrix.triple }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.triple }}
          path: dist/*.tar.gz*

  publish:
    needs: build
    runs-on: ubuntu-24.04
    # Set the tap secret on this environment, restricted to `v*` tags (README, Development).
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ env.TAG }}", fetch-depth: 0, persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { path: dist, pattern: "dist-*", merge-multiple: true }
      - name: checksums and notes
        run: |
          (cd dist && cat *.sha256 > SHA256SUMS && sha256sum -c SHA256SUMS)
          scripts/changelog.sh --notes "$TAG" > notes.md
          make homebrew-formula VERSION="${TAG#v}"
      - name: GitHub release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "ptyro $TAG" --notes-file notes.md --verify-tag
          gh release upload "$TAG" dist/*.tar.gz dist/SHA256SUMS dist/ptyro.rb --clobber
      # Needs a secret HOMEBREW_TAP_TOKEN on the `release` environment: a fine-grained token with
      # contents: write on nealhardesty/homebrew-ptyro only.
      - name: Homebrew tap
        env: { TAP_TOKEN: "${{ secrets.HOMEBREW_TAP_TOKEN }}" }
        if: env.TAP_TOKEN != ''
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/nealhardesty/homebrew-ptyro" tap
          mkdir -p tap/Formula && cp dist/ptyro.rb tap/Formula/ptyro.rb
          cd tap && git add Formula/ptyro.rb
          # A rebuild of the same version leaves the formula unchanged: nothing to commit.
          git diff --cached --quiet || { git -c user.name="ptyro release" -c user.email="release@users.noreply.github.com" commit -m "ptyro $TAG" && git push; }
