# Throwaway (ROADMAP WIN0.5 f / WIN2): how long `make test-wsl` takes on a hosted runner. Deleted after.
name: wsl-probe
on: push
jobs:
  wsl:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        with:
          distribution: Ubuntu-24.04
          additional-packages: build-essential pkg-config git make curl ca-certificates zsh
      - shell: wsl-bash {0}
        run: |
          set -e
          date
          git clone -q https://github.com/${{ github.repository }} ~/ptyro
          cd ~/ptyro && git checkout -q master && git log --oneline -1
          make rust-install
          date
          make test-wsl
          date
