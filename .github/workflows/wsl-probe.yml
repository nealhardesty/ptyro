# Throwaway (ROADMAP WIN0.5 f / WIN2): what WSL a hosted Windows runner has. Deleted after.
name: wsl-probe
on: push
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - shell: pwsh
        continue-on-error: true
        run: |
          wsl --version
          (Get-CimInstance Win32_ComputerSystem).HypervisorPresent
          (Get-CimInstance Win32_Processor).VirtualizationFirmwareEnabled
      - uses: Vampire/setup-wsl@v5
        continue-on-error: true
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
      - shell: pwsh
        continue-on-error: true
        run: |
          wsl -l -v
          wsl -d Ubuntu-24.04 -- sh -c 'uname -r; cat /proc/sys/kernel/osrelease; ps -o comm= -p 1; nproc; free -m | head -2'
          "exit $LASTEXITCODE"
