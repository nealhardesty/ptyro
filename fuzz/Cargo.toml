# Coverage-guided fuzzing with cargo-fuzz (nightly): `make fuzz TARGET=emulator`.
# The targets live in ptyro-testkit (src/fuzz.rs) so the stable runner (`make fuzz-smoke`) and
# this one fuzz the same code. Not part of the workspace: it needs nightly and libFuzzer.
[package]
name = "ptyro-fuzz"
version = "0.0.0"
publish = false
license = "MIT"
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ptyro-testkit = { path = "../crates/ptyro-testkit" }

[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "sniff"
path = "fuzz_targets/sniff.rs"
test = false
doc = false
bench = false

[[bin]]
name = "emulator"
path = "fuzz_targets/emulator.rs"
test = false
doc = false
bench = false

[[bin]]
name = "protocol"
path = "fuzz_targets/protocol.rs"
test = false
doc = false
bench = false

[[bin]]
name = "input"
path = "fuzz_targets/input.rs"
test = false
doc = false
bench = false

[[bin]]
name = "recipe"
path = "fuzz_targets/recipe.rs"
test = false
doc = false
bench = false

[[bin]]
name = "record"
path = "fuzz_targets/record.rs"
test = false
doc = false
bench = false

[[bin]]
name = "settings"
path = "fuzz_targets/settings.rs"
test = false
doc = false
bench = false

[[bin]]
name = "imports"
path = "fuzz_targets/imports.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hostjson"
path = "fuzz_targets/hostjson.rs"
test = false
doc = false
bench = false

[[bin]]
name = "handoff"
path = "fuzz_targets/handoff.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parsers"
path = "fuzz_targets/parsers.rs"
test = false
doc = false
bench = false
